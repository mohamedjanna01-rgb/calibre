# Appel 08 – script de production audio
# Ne jamais transmettre ce fichier à l'IA qui note : les consignes de ton révèlent les fautes.
id: appel-08
casting:
  conseiller:
    personnage: "Leïla Amrani"
    voix: Laomedeia
    profil: "femme, 35 ans, télévendeuse, voix vive et souriante, français standard"
  client:
    personnage: "Isabelle Moreau"
    voix: Erinome
    profil: "femme, 56 ans, voix claire, pressée mais polie, français standard"
repliques:
  - n: 1
    locuteur: conseiller
    texte: "Bonjour, Madame Moreau ? Je m'appelle Leïla Amrani, je suis conseillère chez Kalyo Télécom, et c'est moi qui m'occupe de votre contrat Box Internet. Je vous informe que notre échange est susceptible d'être enregistré pour des raisons de qualité. Avez-vous quelques instants ?"
    ton: "souriante, vive, polie"
  - n: 2
    locuteur: client
    texte: "Oui, rapidement."
    ton: "pressée, un peu sèche"
  - n: 3
    locuteur: conseiller
    texte: "Merci, je serai brève. Pour sécuriser notre échange, pouvez-vous me confirmer votre nom et prénom, votre code postal et votre date de naissance ?"
    ton: "compréhensive, rythme rapide"
  - n: 4
    locuteur: client
    texte: "Moreau Isabelle, 35000, le 17 octobre 1970."
    ton: "rapide"
  - n: 5
    locuteur: conseiller
    texte: "Merci, Madame Moreau. Je vous appelle pour un avantage réservé à nos clients Box sur le mobile. Vos téléphones portables sont-ils chez nous ou chez un autre opérateur ?"
    ton: "dynamique, efficace"
  - n: 6
    locuteur: client
    texte: "Chez un autre opérateur. Deux lignes, à 11,99 € chacune."
    ton: "neutre, factuelle"
  - n: 7
    locuteur: conseiller
    texte: "D'accord. Comme vous avez déjà une box chez nous, vous avez droit à l'Avantage Foyer : 5 € de remise par mois sur chaque forfait mobile de 80 Go ou plus. Concrètement, notre forfait 80 Go passerait de 14,99 € à 9,99 € par mois. Pour vos deux lignes, vous paieriez 19,98 € au lieu de 23,98 € : 4 € d'économie par mois, soit près de 50 € par an. Et vous auriez une seule facture pour toute la maison, internet et mobiles. Les forfaits sont sans engagement, et vous gardez vos numéros."
    ton: "claire, enthousiaste, chiffres bien articulés"
  - n: 8
    locuteur: client
    texte: "Non merci, je suis bien chez mon opérateur, je n'ai pas envie de changer."
    ton: "polie, ferme"
  - n: 9
    locuteur: conseiller
    texte: "Je comprends tout à fait, changer peut sembler compliqué. Puis-je vous demander ce qui vous retient le plus : la démarche, ou le fait d'être satisfaite de votre opérateur actuel ?"
    ton: "douce, curieuse, sans insister"
  - n: 10
    locuteur: client
    texte: "Je suis satisfaite, et franchement, 4 € par mois, ça ne vaut pas le dérangement pour moi."
    ton: "polie, définitive"
  - n: 11
    locuteur: conseiller
    texte: "C'est tout à fait légitime, Madame Moreau, et je respecte votre choix. Je suis désolée de ne pas avoir trouvé une offre qui vous convienne vraiment aujourd'hui. Je note votre réponse, pour que nous ne vous rappelions pas à ce sujet. Avez-vous des questions sur votre box ou votre contrat ?"
    ton: "respectueuse, sincère, souriante"
  - n: 12
    locuteur: client
    texte: "Non, tout va bien, merci."
    ton: "cordiale"
  - n: 13
    locuteur: conseiller
    texte: "Merci pour le temps que vous m'avez accordé, Madame Moreau. Je vous souhaite une excellente journée, au revoir !"
    ton: "chaleureuse"
  - n: 14
    locuteur: client
    texte: "Au revoir."
    ton: "cordiale"
