# Appel 03 – script de production audio
# Ne jamais transmettre ce fichier à l'IA qui note : les consignes de ton révèlent les fautes.
id: appel-03
casting:
  conseiller:
    personnage: "Inès Kaddouri"
    voix: Aoede
    profil: "femme, 26 ans, conseillère, voix féminine directe, français standard"
  client:
    personnage: "Julien Martin"
    voix: Fenrir
    profil: "homme, 36 ans, voix énergique qui monte facilement, français standard"
repliques:
  - n: 1
    locuteur: conseiller
    texte: "Kalyo Télécom, bonjour ! Je m'appelle Inès Kaddouri, je suis votre conseillère clientèle, et je vais m'occuper de votre demande. Je vous informe que cet appel est susceptible d'être enregistré pour des raisons de qualité. Puis-je avoir votre nom et prénom ?"
    ton: "professionnelle mais un peu mécanique"
  - n: 2
    locuteur: client
    texte: "Martin, Julien Martin. Et je vous préviens, c'est la troisième fois que j'appelle cette semaine !"
    ton: "agacé, sec, hausse le ton sur « la troisième fois »"
  - n: 3
    locuteur: conseiller
    texte: "Merci, Monsieur Martin. Pour sécuriser votre dossier, pouvez-vous me donner votre numéro de ligne, votre code postal et votre date de naissance ?"
    ton: "neutre, routinière"
  - n: 4
    locuteur: client
    texte: "06 39 98 45 08, 44000, 8 novembre 1990. Bon, je vous explique : tous les soirs, internet coupe. Tous les soirs ! J'ai appelé lundi, on m'a dit de redémarrer la box. J'ai rappelé mercredi, on m'a dit que ça allait s'arranger. Et là…"
    ton: "énervé, de plus en plus fort, insiste sur « Tous les soirs ! » ; il est coupé net après « Et là »"
    coupee: true
  - n: 5
    locuteur: conseiller
    texte: "Oui, oui, j'ai compris, je vois vos appels dans l'historique."
    ton: "impatiente, expéditive, coupe la parole au client"
    chevauchement_ms: 500
  - n: 6
    locuteur: client
    texte: "Non, vous n'avez pas compris ! Je paie 40 € par mois pour un service qui ne marche pas, je travaille le soir, et personne ne fait rien !"
    ton: "en colère, voix forte, exaspéré"
  - n: 7
    locuteur: conseiller
    texte: "Calmez-vous, Monsieur Martin. Ce n'est pas moi qui ai traité vos appels précédents, je ne peux pas savoir ce que mes collègues vous ont dit."
    ton: "sèche, sur la défensive, un peu condescendante"
  - n: 8
    locuteur: client
    texte: "Je m'en fiche de qui c'était ! Moi, je veux que ça marche !"
    ton: "très en colère, crie presque"
  - n: 9
    locuteur: conseiller
    texte: "Je comprends. Je regarde votre box à distance. À quelle heure ont lieu les coupures ?"
    ton: "redevient professionnelle, neutre, un peu froide"
  - n: 10
    locuteur: client
    texte: "Vers 20 h, 21 h, à chaque fois."
    ton: "encore agacé, mais répond"
  - n: 11
    locuteur: conseiller
    texte: "D'accord. Effectivement, je vois plusieurs coupures chaque soir sur les sept derniers jours, avec un signal fibre trop faible. Ce n'est donc pas un problème de redémarrage : il faut qu'un technicien vienne contrôler la ligne chez vous."
    ton: "factuelle, claire, compétente"
    pause_avant_ms: 1500
  - n: 12
    locuteur: client
    texte: "<sigh> Enfin quelqu'un qui voit le problème…"
    ton: "soulagement teinté d'ironie"
  - n: 13
    locuteur: conseiller
    texte: "Je vous propose un rendez-vous jeudi entre 14 h et 18 h. Est-ce que ça vous convient ?"
    ton: "efficace, neutre"
  - n: 14
    locuteur: client
    texte: "Oui, jeudi ça me va."
    ton: "plus calme, las"
  - n: 15
    locuteur: conseiller
    texte: "C'est noté, Monsieur Martin. Le technicien contrôlera la prise fibre et la ligne. Vous recevrez un SMS de confirmation, puis un rappel la veille. Pour récapituler : les coupures viennent d'un signal fibre trop faible, et un technicien passe jeudi entre 14 h et 18 h. Avez-vous d'autres questions ?"
    ton: "claire, professionnelle, sans chaleur"
  - n: 16
    locuteur: client
    texte: "Non, c'est bon."
    ton: "las, sec"
  - n: 17
    locuteur: conseiller
    texte: "Merci pour votre appel, Monsieur Martin. Je vous souhaite une bonne soirée, au revoir."
    ton: "polie mais expéditive"
